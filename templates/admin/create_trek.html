{% extends "base.html" %}


{% block title %}
Create Trek
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Create New Trek
                </h2>


                <form method="POST">


                    <div class="mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input type="text"
                               name="location"
                               class="form-control"
                               required>

                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Difficulty
                            </label>

                            <select name="difficulty"
                                    class="form-select"
                                    required>

                                <option value="Easy">
                                    Easy
                                </option>

                                <option value="Moderate">
                                    Moderate
                                </option>

                                <option value="Hard">
                                    Hard
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Duration in Days
                            </label>

                            <input type="number"
                                   name="duration_days"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>


                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Total Slots
                            </label>

                            <input type="number"
                                   name="total_slots"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select name="status"
                                    class="form-select"
                                    required>

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="Approved">
                                    Approved
                                </option>

                                <option value="Open">
                                    Open
                                </option>

                                <option value="Closed">
                                    Closed
                                </option>

                                <option value="Completed">
                                    Completed
                                </option>

                            </select>

                        </div>


                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Start Date
                            </label>

                            <input type="date"
                                   name="start_date"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                End Date
                            </label>

                            <input type="date"
                                   name="end_date"
                                   class="form-control"
                                   required>

                        </div>


                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Price
                            </label>

                            <input type="number"
                                   name="price"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   value="0">

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Altitude
                            </label>

                            <input type="text"
                                   name="altitude"
                                   class="form-control"
                                   placeholder="Example: 12,500 ft">

                        </div>


                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4"></textarea>

                    </div>


                    <button type="submit"
                            class="btn btn-primary">

                        Create Trek

                    </button>


                    <a href="{{ url_for('admin_treks') }}"
                       class="btn btn-secondary">

                        Cancel

                    </a>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
