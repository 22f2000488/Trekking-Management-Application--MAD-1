{% extends "base.html" %}


{% block title %}
Edit Trek
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Edit Trek
                </h2>


                <form method="POST">


                    <div class="mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ trek.name }}"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input type="text"
                               name="location"
                               class="form-control"
                               value="{{ trek.location }}"
                               required>

                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Difficulty
                            </label>

                            <select name="difficulty"
                                    class="form-select">

                                <option value="Easy"
                                    {% if trek.difficulty == "Easy" %}selected{% endif %}>
                                    Easy
                                </option>

                                <option value="Moderate"
                                    {% if trek.difficulty == "Moderate" %}selected{% endif %}>
                                    Moderate
                                </option>

                                <option value="Hard"
                                    {% if trek.difficulty == "Hard" %}selected{% endif %}>
                                    Hard
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Duration Days
                            </label>

                            <input type="number"
                                   name="duration_days"
                                   class="form-control"
                                   min="1"
                                   value="{{ trek.duration_days }}"
                                   required>

                        </div>


                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Total Slots
                            </label>

                            <input type="number"
                                   name="total_slots"
                                   class="form-control"
                                   min="1"
                                   value="{{ trek.total_slots }}"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Available Slots
                            </label>

                            <input type="number"
                                   name="available_slots"
                                   class="form-control"
                                   min="0"
                                   value="{{ trek.available_slots }}"
                                   required>

                        </div>


                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select name="status"
                                class="form-select">

                            {% for value in ["Pending", "Approved", "Open", "Closed", "Completed"] %}

                                <option value="{{ value }}"
                                    {% if trek.status == value %}selected{% endif %}>

                                    {{ value }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Start Date
                            </label>

                            <input type="date"
                                   name="start_date"
                                   class="form-control"
                                   value="{{ trek.start_date }}"
                                   required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                End Date
                            </label>

                            <input type="date"
                                   name="end_date"
                                   class="form-control"
                                   value="{{ trek.end_date }}"
                                   required>

                        </div>


                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Price
                            </label>

                            <input type="number"
                                   name="price"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   value="{{ trek.price }}">

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Altitude
                            </label>

                            <input type="text"
                                   name="altitude"
                                   class="form-control"
                                   value="{{ trek.altitude }}">

                        </div>


                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea name="description"
                                  class="form-control"
                                  rows="4">{{ trek.description }}</textarea>

                    </div>


                    <button type="submit"
                            class="btn btn-primary">
                        Save Changes
                    </button>


                    <a href="{{ url_for('admin_treks') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
