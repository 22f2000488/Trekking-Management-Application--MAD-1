{% extends "base.html" %}


{% block title %}
Manage Trek
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2>
                    Manage {{ trek.name }}
                </h2>

                <p class="text-muted">
                    {{ trek.location }}
                </p>


                <form method="POST">


                    <div class="mb-3">

                        <label class="form-label">
                            Total Slots
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            value="{{ trek.total_slots }}"
                            disabled
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            min="0"
                            max="{{ trek.total_slots }}"
                            value="{{ trek.available_slots }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Trek Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                            required
                        >

                            {% for value in ["Open", "Closed", "Completed"] %}

                            <option
                                value="{{ value }}"

                                {% if trek.status == value %}
                                    selected
                                {% endif %}
                            >

                                {{ value }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        Save Changes

                    </button>


                    <a
                        href="{{ url_for('staff_dashboard') }}"
                        class="btn btn-secondary"
                    >

                        Cancel

                    </a>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
