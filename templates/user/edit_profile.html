{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Edit Profile
                </h2>


                <form method="POST">


                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ current_user.username }}"
                            disabled
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            value="{{ current_user.email }}"
                            disabled
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            value="{{ current_user.full_name }}"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ current_user.phone }}"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Bio
                        </label>

                        <textarea
                            name="bio"
                            class="form-control"
                            rows="4"
                        >{{ current_user.bio }}</textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>


                    <a
                        href="{{ url_for('user_dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
