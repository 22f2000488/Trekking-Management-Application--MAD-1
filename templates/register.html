{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>


                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Register As
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="user">
                                Trekker
                            </option>

                            <option value="staff">
                                Trek Staff
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
